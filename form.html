<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <br />
    <form action="#" method="get">
      <div>
        <label for="name">Siapa nama anda?</label><br />
        <input type="text" name="nama" placeholder="" required/>
        <br />
      </div>
      <div>
        <label for="umur">Berapa umur anda?</label><br />
        <input type="text" name="umur" placeholder="" required />
        <br />
      </div>
      <div>
        <label for="desc2">Apa jenis kelamin anda?</label><br />
        <input type="radio" name="jenis-kelamin" id="laki" value="laki-laki" required/>
        <label for="genderLk">laki-laki</label>
        <input type="radio" name="jenis-kelamin" id="pr" value="perempuan" required/>
        <label for="genderPr">perempuan</label><br />
      </div>
      <div>
        <label for="desc2">Apakah anda perokok?</label><br />
        <input type="radio" name="rokok" id="ya" value="ya" required/>
        <label for="true">Ya</label>
        <input type="radio" name="rokok" id="tidak" value="tidak" required/>
        <label for="false">Tidak</label><br />
      </div>
      <div>
        <label for="rokok"
          >Jika anda perokok, rokok apa yang pernah anda coba</label
        ><br />
        <input type="checkbox" name="jenis-rokok" id="gudang" value="Gudang Garam" />
        <label for="garam">Gudang Garam Filter</label><br />
        <input type="checkbox" name="jenis-rokok" id="lucky" value="Lucky Strike" />
        <label for="strike">Lucky Strike</label><br />
        <input type="checkbox" name="jenis-rokok" id="marlboro" value="Marlboro" />
        <label for="mb">Marlboro</label><br />
        <input type="checkbox" name="jenis-rokok" id="ess" value="Esse" />
        <label for="esse">Esse</label>
      </div>

      <br />
      <br />
      <button type="submit"><a href="hasilSurvey.html">Submit</a></button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
