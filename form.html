<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <br />
    <form action="post">
      <label for="name">Siapa nama anda?</label><br />
      <input type="text" name="nama" placeholder="" />
      <br />
      <label for="umur">Berapa umur anda?</label><br />
      <input type="text" name="umur" placeholder="" />
      <br />
      <label for="desc2">Apa jenis kelamin anda?</label><br />
      <input type="radio" name="laki-laki" id="laki" />
      <label for="genderLk">laki-laki</label>
      <input type="radio" name="perempuan" id="pr" />
      <label for="genderPr">perempuan</label><br />
      <label for="desc2">Apakah anda perokok?</label><br />
      <input type="radio" name="ya" id="ya" />
      <label for="true">Ya</label>
      <input type="radio" name="tidak" id="tidak" />
      <label for="false">Tidak</label><br />
      <label for="rokok"
        >Jika anda perokok, rokok apa yang pernah anda coba</label
      ><br />
      <input type="checkbox" name="gudang" id="gudang" />
      <label for="garam">Gudang Garam Filter</label><br />
      <input type="checkbox" name="lucky" id="lucky" />
      <label for="strike">Lucky Strike</label><br />
      <input type="checkbox" name="marlboro" id="marlboro" />
      <label for="mb">Marlboro</label><br />
      <input type="checkbox" name="ess" id="ess" />
      <label for="esse">Esse</label>

      <br />
      <br />
      <button type="submit">Submit</button>
      <button type="">Reset</button>
    </form>
  </body>
</html>
